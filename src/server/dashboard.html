<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTTP Contract Harness</title>
    <style>
      :root {
        --bg: #fbfbfa;
        --panel: #ffffff;
        --ink: #1d1d1b;
        --muted: #6b6b66;
        --line: #e6e5e1;
        --pass: #1f7a4d;
        --pass-bg: #e6f4ec;
        --warn: #8a5a00;
        --warn-bg: #fdf2dc;
        --fail: #b42318;
        --fail-bg: #fde8e6;
        --unknown: #8a8a84;
        --unknown-bg: #f1f1ef;
        --accent: #2457c5;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #141413;
          --panel: #1c1c1a;
          --ink: #ecebe6;
          --muted: #9c9b94;
          --line: #2e2d2a;
          --pass: #5fd09a;
          --pass-bg: #163325;
          --warn: #f0bf5a;
          --warn-bg: #3a2d10;
          --fail: #ff8a7d;
          --fail-bg: #3d1a16;
          --unknown: #8f8e87;
          --unknown-bg: #262624;
          --accent: #8db0ff;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #141413;
        --panel: #1c1c1a;
        --ink: #ecebe6;
        --muted: #9c9b94;
        --line: #2e2d2a;
        --pass: #5fd09a;
        --pass-bg: #163325;
        --warn: #f0bf5a;
        --warn-bg: #3a2d10;
        --fail: #ff8a7d;
        --fail-bg: #3d1a16;
        --unknown: #8f8e87;
        --unknown-bg: #262624;
        --accent: #8db0ff;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      code,
      .mono {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12.5px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      h1 {
        font-size: 16px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .sub {
        color: var(--muted);
        font-size: 12.5px;
      }
      main {
        padding: 16px;
        max-width: 1880px;
        margin: 0 auto;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--muted);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--panel);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      select {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .targets {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }
      .card h2 {
        font-size: 14px;
        margin: 0 0 2px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .counts {
        display: flex;
        gap: 10px;
        margin: 8px 0;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        display: flex;
        height: 6px;
        border-radius: 3px;
        overflow: hidden;
        background: var(--unknown-bg);
      }
      .bar span {
        display: block;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 12px;
        white-space: nowrap;
      }
      .pass {
        color: var(--pass);
      }
      .pill.pass,
      .bg-pass {
        background: var(--pass-bg);
      }
      .warn {
        color: var(--warn);
      }
      .pill.warn,
      .bg-warn {
        background: var(--warn-bg);
      }
      .fail {
        color: var(--fail);
      }
      .pill.fail,
      .bg-fail {
        background: var(--fail-bg);
      }
      .unknown {
        color: var(--unknown);
      }
      .pill.unknown,
      .bg-unknown {
        background: var(--unknown-bg);
      }
      .table-wrap {
        overflow-x: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        font-weight: 500;
        color: var(--muted);
        font-size: 12px;
        position: sticky;
        top: 0;
        background: var(--panel);
      }
      tr.route {
        cursor: pointer;
      }
      tr.route:hover td {
        background: color-mix(in srgb, var(--line) 35%, transparent);
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 170px;
      }
      .why {
        color: var(--muted);
        font-size: 12px;
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .detail td {
        background: var(--bg);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 10px;
      }
      .comparison {
        margin-bottom: 12px;
      }
      .comparison > .sub {
        margin-bottom: 4px;
      }
      .pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        max-width: 1100px;
      }
      @media (max-width: 640px) {
        .pair {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      /* Revealed on hover, and always shown on screens that cannot hover. */
      .copy {
        font-size: 11.5px;
        padding: 1px 8px;
        margin-left: 6px;
        opacity: 0;
        transition: opacity 0.12s;
      }
      tr.route > td:hover .copy,
      .card:hover .copy,
      .copy:focus-visible {
        opacity: 1;
      }
      @media (hover: none) {
        .copy {
          opacity: 1;
        }
      }
      /* Kept to the visible width, since the table can scroll wider than the page. */
      .detail-body {
        position: sticky;
        left: 0;
        max-width: calc(100vw - 120px);
      }
      .case {
        margin: 6px 0 14px;
      }
      .case h3 {
        font-size: 13px;
        margin: 0 0 6px;
      }
      .kv {
        display: grid;
        grid-template-columns: 70px 1fr;
        gap: 2px 8px;
        font-size: 12.5px;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .progress {
        min-width: 220px;
      }
      .progress .bar span {
        background: var(--accent);
        transition: width 0.2s;
      }
      .history {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
      }
      .empty {
        padding: 32px;
        text-align: center;
        color: var(--muted);
      }
      .problem {
        background: var(--fail-bg);
        color: var(--fail);
        padding: 8px 12px;
        border-radius: 6px;
        margin-bottom: 12px;
        display: none;
      }
      @media (max-width: 640px) {
        header {
          position: static;
        }
        .why {
          max-width: 160px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>HTTP Contract Harness</h1>
        <div class="sub" id="root"></div>
      </div>
      <div class="toolbar">
        <div class="progress" id="progress" hidden>
          <div class="sub" id="progress-text"></div>
          <div class="bar"><span id="progress-bar" style="width: 0"></span></div>
        </div>
        <input id="label" placeholder="run label (optional)" size="16" aria-label="Run label" />
        <button class="primary" id="run-all">Run every target</button>
        <button id="ratchet" title="Tighten every lock a target now beats">Ratchet</button>
      </div>
    </header>
    <main>
      <div class="problem" id="problem"></div>
      <section class="card" id="plan" style="margin-bottom: 16px"></section>
      <section class="targets" id="targets"></section>
      <div class="toolbar" style="margin-bottom: 10px">
        <input
          id="filter"
          placeholder="Filter routes"
          aria-label="Filter routes"
          style="flex: 1; min-width: 160px"
        />
        <select id="state" aria-label="Show">
          <option value="attention">Needs attention</option>
          <option value="all">Every route</option>
          <option value="fail">Failing</option>
          <option value="unknown">Not judged yet</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="head"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id)
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        )
      const ms = (n) => (n == null ? "–" : Math.round(n) + "ms")
      const GLYPH = { pass: "✓", warn: "!", fail: "✗", unknown: "·" }
      let state = null
      const open = new Set()

      function store(key, value) {
        try {
          localStorage.setItem(key, value)
        } catch {}
      }
      function load(key) {
        try {
          return localStorage.getItem(key)
        } catch {
          return null
        }
      }

      function reason(c) {
        if (!c.observed) return "not run"
        const error = c.contract.diffs.find((d) => d.field === "error")
        if (error) return "error: " + error.actual
        if (c.stale) return "stale lock: the probe changed"
        if (c.reference === "none") return "unlocked"
        if (c.reference === "self" && c.state === "pass") return "reference"
        const d = c.contract.diffs.find((d) => !d.allowed && !d.improved && d.policy !== "ignore")
        if (c.contract.state === "fail" && d)
          return d.field === "error"
            ? "error: " + d.actual
            : `${d.field}: ${d.expected ?? "∅"} → ${d.actual ?? "∅"}`
        if (c.perf.note?.includes("carry it back"))
          return `${c.perf.against} is faster: ${ms(c.perf.baseline?.median)}, carry back?`
        if (c.perf.state === "fail" || c.perf.state === "warn")
          return c.perf.call !== "worse"
            ? `median ${ms(c.perf.actual?.median)} > max ${ms(c.perf.max)}`
            : `slower${c.perf.against ? " than " + c.perf.against : ""}: ${ms(c.perf.baseline?.median)} → ${ms(c.perf.actual?.median)}${c.perf.paired === false ? " (another run)" : ""}`
        if (c.contract.state === "warn" && d)
          return `${d.field}: ${d.expected ?? "∅"} → ${d.actual ?? "∅"}, fast enough`
        return ""
      }

      function worstCase(route) {
        for (const s of ["fail", "warn", "pass", "unknown"]) {
          const c = route.cases.find((c) => c.state === s)
          if (c) return c
        }
      }

      const many = () => new Set(state.status.map((s) => s.vantage)).size > 1
      const col = (s) => (many() ? `${s.target}/${s.vantage}` : s.target)
      const from = (s) => {
        const v = state.vantages.find((x) => x.name === s.vantage)
        return `from ${s.vantage}${v?.regionName ? " · " + v.regionName : ""}`
      }
      const colHtml = (s) =>
        `${esc(s.target)}${many() ? `<div class="sub" style="font-weight:400">${esc(from(s))}</div>` : ""}`
      const promptKey = (s, c) => `${s.target}/${s.vantage} ${c.key}`
      const copyButton = (s, c) =>
        c && state.prompts?.[promptKey(s, c)]
          ? `<button class="copy" data-copy="${esc(promptKey(s, c))}" title="Copy a prompt that asks an agent to fix this">Copy prompt</button>`
          : ""

      function renderPlan() {
        const p = state.plan
        const phase = p.phases.find((x) => x.id === p.phase)
        const strip = p.phases
          .map(
            (x) =>
              `<span class="pill ${x.done ? "pass" : x.id === p.phase ? "warn" : "unknown"}">${x.done ? "✓" : x.id === p.phase ? "→" : "·"} ${esc(x.id)}</span>`,
          )
          .join(" ")
        const open = state.ledger.experiments.filter((e) => !e.decision)
        const decided = state.ledger.experiments
          .filter((e) => e.decision)
          .slice(-5)
          .reverse()
        const findings = state.ledger.findings.slice(-5).reverse()
        $("plan").innerHTML =
          `<h2><span>${esc(phase.title)}</span><span class="sub">readiness ${Math.round(p.readiness.score * 100)}%</span></h2>
          <div style="margin:6px 0 10px">${strip}</div>
          <div class="grid">
            <div>${phase.checks.map((c) => `<div class="${c.ok ? "pass" : c.note ? "warn" : "fail"}">${c.ok ? "✓" : c.note ? "!" : "✗"} ${esc(c.text)}</div>`).join("")}
              ${phase.next.map((n) => `<div class="sub mono">next: ${esc(n)}</div>`).join("")}</div>
            <div><div class="sub">Experiments</div>${open.map((e) => `<div class="warn">${esc(e.id)}: ${esc(e.theory)}</div>`).join("")}
              ${decided.map((e) => `<div class="${e.decision.verdict === "keep" ? "pass" : "unknown"}">${esc(e.decision.verdict)} · ${esc(e.theory)}<div class="sub">${esc(e.decision.why)}</div></div>`).join("") || (open.length ? "" : '<div class="sub">none yet</div>')}</div>
            <div><div class="sub">Findings</div>${findings.map((f) => `<div>${esc(f.text)}</div>`).join("") || '<div class="sub">none yet</div>'}</div>
          </div>`
      }

      function renderTargets() {
        $("targets").innerHTML = state.status
          .map((s) => {
            const { target, evaluation: e } = s
            const t = state.project.targets.find((x) => x.name === target)
            const total = Object.values(e.counts).reduce((a, b) => a + b, 0) || 1
            const seg = (k) =>
              `<span class="bg-${k}" style="width:${(e.counts[k] / total) * 100}%;background:var(--${k})"></span>`
            const last = state.runs.find((r) => r.target === target && r.vantage === s.vantage)
            return `<div class="card">
      <h2><span>${esc(col(s))}${target === state.project.baseline ? ' <span class="pill unknown">baseline</span>' : ""}</span>
      <button data-run="${esc(target)}">Run</button></h2>
      <div class="sub mono">${esc(t?.url)}</div>
      <div class="counts"><span class="pass">${e.counts.pass} pass</span><span class="warn">${e.counts.warn} warn</span><span class="fail">${e.counts.fail} fail</span><span class="unknown">${e.counts.unknown} unknown</span></div>
      <div class="bar">${["pass", "warn", "fail", "unknown"].map(seg).join("")}</div>
      <div class="sub" style="margin-top:6px">${last ? `last run #${last.id}${last.label ? "@" + esc(last.label) : ""} · ${new Date(last.startedAt).toLocaleString()}${last.gitSha ? " · " + esc(last.gitSha) : ""}` : "never run"}
      ${target === state.project.baseline ? ` · <a href="#" data-lock="${esc(target)}">lock unlocked cases from here</a>` : ""}</div>
    </div>`
          })
          .join("")
      }

      function rows() {
        const byTarget = state.status.map(({ target, evaluation }) => ({
          target,
          map: new Map(evaluation.routes.map((r) => [r.route, r])),
        }))
        const routes = new Map()
        for (const { evaluation } of state.status)
          for (const r of evaluation.routes) if (!routes.has(r.route)) routes.set(r.route, r)
        const filter = $("filter").value.trim().toLowerCase()
        const mode = $("state").value
        return [...routes.values()]
          .map((r) => ({ route: r, cells: byTarget.map((t) => t.map.get(r.route)) }))
          .filter(({ route, cells }) => {
            if (filter && !route.route.toLowerCase().includes(filter)) return false
            if (mode === "all") return true
            if (mode === "fail") return cells.some((c) => c?.state === "fail")
            if (mode === "unknown") return cells.some((c) => c?.state === "unknown")
            return cells.some((c) => c && c.state !== "pass")
          })
          .sort(
            (a, b) => b.route.weight - a.route.weight || a.route.route.localeCompare(b.route.route),
          )
      }

      function renderTable() {
        $("head").innerHTML =
          `<tr><th>Route</th><th style="text-align:right">Weight</th><th>Declared</th>${state.status.map((s) => `<th>${colHtml(s)}</th>`).join("")}</tr>`
        const list = rows()
        if (list.length === 0) {
          const none = state.status[0]?.evaluation.routes.length === 0
          $("rows").innerHTML =
            `<tr><td class="empty" colspan="${3 + state.status.length}">${none ? "No routes in the lock yet. Run <code>hch discover</code>." : "Nothing needs attention with this filter."}</td></tr>`
          return
        }
        $("rows").innerHTML = list
          .map(({ route, cells }) => {
            const declared = route.declared
              ? `${route.declared.mode}${route.declared.revalidate ? " " + route.declared.revalidate + "s" : ""}`
              : ""
            const tds = cells
              .map((r, i) => {
                if (!r) return "<td>–</td>"
                const c = worstCase(r)
                const p75 = Math.max(0, ...r.cases.map((x) => x.perf.actual?.p75 ?? 0)) || null
                const tag =
                  r.cases.length > 1 && c && c.state !== "pass" ? "#" + c.caseId + " " : ""
                const why = r.samples === 0 ? "no sample" : tag + reason(c)
                return `<td><div class="cell"><span><span class="pill ${r.state}">${GLYPH[r.state]} ${r.state}</span> <span class="mono sub">${ms(p75)}</span>${copyButton(state.status[i], c)}</span><span class="why" title="${esc(why)}">${esc(why)}</span></div></td>`
              })
              .join("")
            const row = `<tr class="route" data-route="${esc(route.route)}"><td class="mono">${esc(route.route)}</td><td class="num">${route.weight}</td><td class="sub">${esc(declared)}</td>${tds}</tr>`
            return row + (open.has(route.route) ? detail(route.route) : "")
          })
          .join("")
      }

      function detail(pattern) {
        const caseIds = [
          ...new Set(
            state.status.flatMap(
              (s) =>
                s.evaluation.routes.find((r) => r.route === pattern)?.cases.map((c) => c.caseId) ??
                [],
            ),
          ),
        ]
        const RANK = { pass: 0, unknown: 1, warn: 2, fail: 3 }
        const verdictOf = (s, id) =>
          s?.evaluation.routes.find((r) => r.route === pattern)?.cases.find((c) => c.caseId === id)
        const statusFor = (target, vantage) =>
          state.status.find((s) => s.target === target && s.vantage === vantage)
        // One row per comparison: the current site on the left, its port on the right.
        const comparisons = []
        const paired = new Set()
        for (const track of state.project.tracks) {
          for (const v of state.vantages) {
            const left = statusFor(track.baseline, v.name)
            const right = statusFor(track.port, v.name)
            if (!left && !right) continue
            for (const s of [left, right]) if (s) paired.add(s)
            comparisons.push({
              title: `${track.name}, ${from(left ?? right)}`,
              cells: [left, right],
            })
          }
        }
        for (const s of state.status)
          if (!paired.has(s)) comparisons.push({ title: from(s), cells: [s] })

        const card = (s, c) => {
          if (!s) return "<div></div>"
          if (!c) return `<div class="card sub">${esc(s.target)}: no such case</div>`
          const kind = (d) =>
            d.allowed
              ? ["unknown", "allowed: " + d.allowed]
              : d.improved
                ? ["pass", "better"]
                : d.policy === "ignore"
                  ? ["unknown", "ignored"]
                  : d.policy === "if-slower"
                    ? ["warn", "matters only if slower"]
                    : ["fail", ""]
          const diffs = c.contract.diffs
            .map((d) => {
              const [cls, why] = kind(d)
              return `<div class="${cls}"><code>${esc(d.field)}</code> ${esc(d.expected ?? "∅")} → ${esc(d.actual ?? "∅")}${why ? " (" + esc(why) + ")" : ""} <span class="sub">${esc(d.sample)}</span></div>`
            })
            .join("")
          const a = c.perf.actual
          return `<div class="card"><h2><span>${esc(s.target)}</span><span>${copyButton(s, c)} <span class="pill ${c.state}">${GLYPH[c.state]} ${c.state}</span></span></h2>
        <div class="sub">${esc(c.probe)}, against ${esc(c.reference)}${c.stale ? " · " + esc(c.stale) : ""}</div>
        <dl class="kv" style="margin-top:8px">
          <dt>contract</dt><dd class="${c.contract.state}">${c.contract.state}${diffs ? "" : c.stale ? " · not compared: the lock is stale" : c.observed ? " · every field matches" : ""}${c.contract.note ? `<div class="sub">${esc(c.contract.note)}</div>` : ""}</dd>
          ${diffs ? `<dt></dt><dd>${diffs}</dd>` : ""}
          <dt>${esc(c.perf.metric)}</dt><dd class="${c.perf.state}">${a ? `median ${ms(a.median)} · p75 ${ms(a.p75)} · n=${a.n}` : "–"}<div class="sub">${c.perf.baseline ? `${esc(c.perf.against ?? "reference")}${c.perf.paired ? " (same batch)" : c.perf.paired === false ? " (another run)" : ""}: median ${ms(c.perf.baseline.median)} · p75 ${ms(c.perf.baseline.p75)} · ${c.perf.call}` : ""}${c.perf.max != null ? ` · max median ${ms(c.perf.max)}` : ""}${c.perf.note ? `<br>${esc(c.perf.note)}` : ""}</div></dd>
        </dl></div>`
        }

        const body = caseIds
          .map((id) => {
            const key = state.status.map((s) => verdictOf(s, id)).find(Boolean)?.key
            const history = (state.history?.[key] ?? [])
              .map(
                (h) =>
                  `<div>${esc(h.at.slice(0, 10))} · ${esc(h.by)} ${esc(h.field)}: ${esc(h.from ?? "–")} → ${esc(h.to ?? "–")}${h.reason ? ` · ${esc(h.reason)}` : ""}</div>`,
              )
              .join("")
            const worst = (row) =>
              Math.max(...row.cells.map((s) => RANK[verdictOf(s, id)?.state ?? "unknown"]))
            const rows = comparisons
              .filter((row) => row.cells.some((s) => verdictOf(s, id)))
              .sort((a, b) => worst(a) - worst(b))
              .map(
                (row) =>
                  `<div class="comparison"><div class="sub">${esc(row.title)}</div><div class="pair">${row.cells.map((s) => card(s, verdictOf(s, id))).join("")}</div></div>`,
              )
              .join("")
            return `<div class="case"><h3 class="mono">#${esc(id)} <button data-lock-case="${esc(key)}" style="font-size:12px;padding:2px 8px">Re-lock from baseline…</button></h3>${history ? `<div class="history" style="margin:0 0 8px">${history}</div>` : ""}${rows}</div>`
          })
          .join("")
        return `<tr class="detail"><td colspan="${3 + state.status.length}"><div class="detail-body">${body}</div></td></tr>`
      }

      function render() {
        $("root").textContent = state.project.root
        renderPlan()
        renderTargets()
        renderTable()
        const r = state.running
        $("progress").hidden = !r
        $("run-all").disabled = Boolean(r)
        if (r) progress(r)
      }

      function progress(r) {
        $("progress").hidden = false
        $("progress-text").textContent =
          `Running ${r.targets.join(" + ")}${r.label ? " @" + r.label : ""}: ${r.done}/${r.total || "…"}`
        $("progress-bar").style.width = r.total ? (r.done / r.total) * 100 + "%" : "0"
      }

      let pending = null
      async function refresh() {
        clearTimeout(pending)
        pending = setTimeout(async () => {
          const res = await fetch("/api/state")
          state = await res.json()
          render()
        }, 120)
      }

      async function post(path, body) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body ?? {}),
        })
        const json = await res.json()
        if (!res.ok) problem(json.error)
        return json
      }

      function problem(message) {
        $("problem").textContent = message
        $("problem").style.display = message ? "block" : "none"
      }

      async function copy(button, text) {
        try {
          await navigator.clipboard.writeText(text)
        } catch {
          const area = document.createElement("textarea")
          area.value = text
          document.body.append(area)
          area.select()
          document.execCommand("copy")
          area.remove()
        }
        button.textContent = "Copied"
        setTimeout(() => (button.textContent = "Copy prompt"), 1500)
      }

      document.addEventListener("click", async (event) => {
        const el = event.target.closest(
          "[data-copy],[data-run],[data-lock],[data-lock-case],tr.route,#run-all,#ratchet",
        )
        if (!el) return
        if (el.dataset.copy) {
          event.stopPropagation()
          return copy(el, state.prompts[el.dataset.copy])
        }
        const label = $("label").value.trim()
        if (el.id === "run-all") return post("/api/run", { label })
        if (el.id === "ratchet") {
          const changes = await post("/api/ratchet", {})
          problem("")
          return alert(
            changes.length
              ? `Tightened ${changes.length}:\n` +
                  changes.map((c) => `${c.key} ${c.field}: ${c.from ?? "∅"} → ${c.to}`).join("\n")
              : "No target beats any lock yet.",
          )
        }
        if (el.dataset.run) {
          event.stopPropagation()
          return post("/api/run", { targets: [el.dataset.run], label })
        }
        if (el.dataset.lock) {
          event.preventDefault()
          const changes = await post("/api/lock", { from: el.dataset.lock })
          return alert(`Locked ${changes.filter((c) => !c.skipped).length} cases.`)
        }
        if (el.dataset.lockCase) {
          event.stopPropagation()
          const why = prompt(`Re-lock ${el.dataset.lockCase} from ${state.project.baseline}. Why?`)
          if (why)
            await post("/api/lock", {
              from: state.project.baseline,
              keys: [el.dataset.lockCase],
              force: true,
              reason: why,
            })
          return
        }
        if (el.matches("tr.route")) {
          const r = el.dataset.route
          open.has(r) ? open.delete(r) : open.add(r)
          renderTable()
        }
      })
      $("filter").addEventListener("input", () => {
        store("harness:filter", $("filter").value)
        renderTable()
      })
      $("state").addEventListener("change", () => {
        store("harness:state", $("state").value)
        renderTable()
      })
      $("filter").value = load("harness:filter") ?? ""
      $("state").value = load("harness:state") ?? "attention"

      const stream = new EventSource("/api/stream")
      stream.addEventListener("change", refresh)
      stream.addEventListener("hello", refresh)
      stream.addEventListener("progress", (e) => progress(JSON.parse(e.data)))
      stream.addEventListener("problem", (e) => problem(JSON.parse(e.data).message))
      refresh()
    </script>
  </body>
</html>
